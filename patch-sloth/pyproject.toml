[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchsloth"
version = "0.1.0"
description = "A second opinion on CNA-only CVSS scores for the CVEs in your lockfile"
requires-python = ">=3.11"

[project.scripts]
patchsloth = "patchsloth.cli:app"

[tool.setuptools.packages.find]
include = ["patchsloth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# explicit, so results do not change with ruff's default rule set
select = ["E", "F", "W", "I", "B", "UP"]
# the scaffold's compact style (one-line ifs, `;`, `l`), and zip() over equal-length columns
ignore = ["E701", "E702", "E741", "B905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Typer declare parameters through default-argument calls
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E401", "E402", "E501"]
