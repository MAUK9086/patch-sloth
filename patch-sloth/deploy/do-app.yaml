# DigitalOcean App Platform spec for the Patch Sloth API + web page (SPEC §12).
# Field names checked against docs.digitalocean.com/products/app-platform/reference/app-spec/ on 2026-10-24.
# Create with the console (Create App -> import spec) or `doctl apps create --spec deploy/do-app.yaml`. [HUMAN]
# The repo root holds the project in patch-sloth/, so source_dir (= Docker build context) is patch-sloth and
# dockerfile_path is relative to the repo root.
# Secrets are added in the console (type SECRET / "Encrypt"), never committed here.
name: patch-sloth
region: nyc                      # GPU Droplets (Option A) run in NYC2/TOR1/ATL1; keep the app close to them
services:
  - name: api
    github:
      repo: MAUK9086/patch-sloth
      branch: master
      deploy_on_push: true
    source_dir: patch-sloth
    dockerfile_path: patch-sloth/deploy/Dockerfile
    http_port: 8080
    instance_count: 1
    # 0.58 GB RSS with the feed loaded (measured locally, 2026-10-24); osv-scanner (opt-in) adds ~0.6 GB per scan.
    # 1 GB would leave no headroom for pandas during a scan.
    instance_size_slug: apps-s-1vcpu-2gb
    # The feed (~0.5 GB in memory) loads before uvicorn accepts traffic; allow ~2.5 min for a slow cold start
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 10
      failure_threshold: 12
    envs:
      - key: PATCHSLOTH_FEED_REPO        # the image bakes feed-2026-10-23; a newer feed-* release is fetched at boot
        value: MAUK9086/patch-sloth
        scope: RUN_TIME
        type: GENERAL
      - key: PATCHSLOTH_FEED_DOWNLOAD
        value: "1"
        scope: RUN_TIME
        type: GENERAL
      - key: PATCHSLOTH_SCAN_ENGINE      # fallback = baked GHSA index (instant); osv = osv-scanner (~30 s/scan)
        value: fallback
        scope: RUN_TIME
        type: GENERAL
      - key: PATCHSLOTH_LLM_BACKEND      # Option B: null (feed vectors only). Option A: vllm
        value: "null"
        scope: RUN_TIME
        type: GENERAL
      # Secrets are NOT in this file: add PAPERINSTRUMENTS_API_KEY (and for the GPU window VLLM_BASE_URL,
      # VLLM_API_KEY) in the console as Encrypted (deploy/DEPLOY_STEPS.md, deploy/RUNBOOK.md)
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /
